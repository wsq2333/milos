apiVersion: apps/v1
kind: Deployment
metadata:
  name: milos-controller
  labels:
    app.kubernetes.io/name: milos-controller
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: milos-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: milos-controller
    spec:
      serviceAccountName: milos-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Build and publish this image yourself before deployment.
          image: ghcr.io/wsq2333/milos:dev
          imagePullPolicy: IfNotPresent
          args:
            - --namespace=$(POD_NAMESPACE)
            - --leader-elect=true
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 30
