# Install in each authorized worker namespace and bind to the worker kubeconfig identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: milos-worker-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [kueue.x-k8s.io]
    resources: [workloads]
    verbs: [get, list]
