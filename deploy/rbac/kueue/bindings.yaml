# Adjust the namespace to match the controller ServiceAccount and WorkflowRuns.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: milos-kueue
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: milos-kueue
subjects:
  - kind: ServiceAccount
    name: milos-controller
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: milos-kueue-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: milos-kueue-policy
subjects:
  - kind: ServiceAccount
    name: milos-controller
    namespace: default
