apiVersion: apps/v1
kind: Deployment
metadata:
  name: milos-controller
spec:
  template:
    spec:
      containers:
        - name: controller
          args:
            - --namespace=$(POD_NAMESPACE)
            - --leader-elect=true
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --enable-volcano
