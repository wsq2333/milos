---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: milos-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - milos.example.io
  resources:
  - workflowruns
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - milos.example.io
  resources:
  - workflowruns/finalizers
  verbs:
  - update
- apiGroups:
  - milos.example.io
  resources:
  - workflowruns/status
  verbs:
  - get
  - patch
  - update
