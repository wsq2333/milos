apiVersion: milos.example.io/v1alpha1
kind: WorkflowRun
metadata:
  generateName: node-timeouts-
spec:
  executionPolicy:
    parallelism: 2
    maxRetries: 0
    workflowTimeoutSeconds: 300
    nodeTimeouts:
      totalSeconds: 120
      runSeconds: 60
  definition:
    nodes:
      - name: slow
        timeouts:
          runSeconds: 5
        container:
          image: busybox:1.37.0
          command: [sh, -c]
          args: ["echo starting; sleep 30; echo finished"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      - name: independent
        container:
          image: busybox:1.37.0
          command: [sh, -c]
          args: ["echo independent branch completed"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      - name: successor
        dependencies: [slow]
        container:
          image: busybox:1.37.0
          command: [sh, -c]
          args: ["echo this should be skipped after slow times out"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
