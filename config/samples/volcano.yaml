apiVersion: milos.example.io/v1alpha1
kind: WorkflowRun
metadata:
  name: volcano
spec:
  execution:
    backend: native-pod
    contractVersion: v1
    admission:
      provider: None
    placement:
      provider: Local
    scheduler:
      name: volcano
      queueName: default
  executionPolicy:
    parallelism: 1
    maxRetries: 0
    workflowTimeoutSeconds: 600
  definition:
    nodes:
      - name: train
        container:
          image: busybox:1.37.0
          command: [sh, -c, 'echo replace-with-your-training-command']
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
